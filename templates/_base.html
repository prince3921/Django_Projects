<!-- templates/_base.html -->

{% load compress %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    <title>Django Tailwind CSS Flowbite</title>
    {% endblock %}

    {% compress css %}
    <link rel="stylesheet" href="{% static 'src/output.css' %}">
    {% endcompress %}

</head>

<body class=" w-full min-h-screen bg-slate-900">

    <!-- Add this -->

    <nav class=" w-full h-16 flex bg-slate-800 mb-5 shadow-lg shadow-blue-200">
        
        <ul class="m-auto flex space-x-4">
            <li class="inline-block px-4 rounded-md py-2 text-white font-semibold hover:bg-slate-400 cursor-pointer"><a href="{% url 'home' %}">Home</a></li>
            <li class="inline-block px-4 rounded-md py-2 text-white font-semibold hover:bg-slate-400 cursor-pointer"><a href="{% url 'about' %}">About</a></li>
            <li class="inline-block px-4 rounded-md py-2 text-white font-semibold hover:bg-slate-400 cursor-pointer"><a href="{% url 'contact' %}">Contact</a></li>
            <li class="inline-block px-4 rounded-md py-2 text-white font-semibold hover:bg-slate-400 cursor-pointer"><a href="{% url 'app-home' %}">App</a></li>
            <li class="inline-block px-4 rounded-md py-2 text-white font-semibold hover:bg-slate-400 cursor-pointer"><a href="{% url 'login' %}">Login</a></li>
           
        </ul>
       
    </nav>
     

    <!-- End of new HTML -->

    <div class="container mx-auto mt-4">
        {% block content %}
        
        {% endblock content %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
</body>

</html>
