{% extends "_base.html" %}
{% block content %}
{% comment %} This page is show all posts card {% endcomment %}
<div class="container my-5 flex justify-around flex-wrap gap-6">
    <div class="row">  
       <h1 class="text-center text-balance font-bold">All Chai</h1>
    </div>
{% comment %} This page show all chai {% endcomment %}
    {% for chai in chais %}
    <div class=" w-1/4 py-4 px-4 card-item rounded-md shadow-lg border border-gray-300">
        <img src="{{ chai.image.url }}" class="card-img-top" alt="{{ chai.name }}">
        <div class="card-body">
            <h5 class="card-title">{{ chai.name }}</h5>
            <p class="card-text">{{ chai.description }}</p>
            <p class="card-text">Price: {{ chai.price }}</p>
        </div>
    </div>
{% endfor %}

</div>
{% endblock %}
